# B1sTeam - LocketGold (Free) MITM proxy (Fly.io)
# MITM TLS (raw TCP :443 -> :8443) + Static HTTP (:8080)
#
# Deploy (tu thu muc proxy/):
#   flyctl secrets set ROOT_CA_CRT="$(base64 -w0 ca/root-ca.crt)" ROOT_CA_KEY="$(base64 -w0 ca/root-ca.key)" --app b1steam-locketgold
#   flyctl deploy --depot=false --app b1steam-locketgold
#
# B1sTeam - b1s.id.vn · Nguyễn Hoàng Bách

app = "b1steam-locketgold"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8443"
  STATIC_PORT = "8080"
  LOG_LEVEL = "info"
  MITM_SANS = "api.revenuecat.com,api.rc-backup.com,rev.cat,firebaseremoteconfig.googleapis.com,firebaseremoteconfig.google.com,www.remoteconfig.googleapis.com,firebaseremoteconfigrealtime.googleapis.com,api.locketcamera.com,cdn.locketcamera.com,public.locketcamera.com,locket.camera,us-central1-locket-4252a.cloudfunctions.net,firebasestorage.googleapis.com,storage.googleapis.com,firebaselogging.googleapis.com"
  FRAME_WORKERS = "https://b1steam-frames-1.nhb-120111.workers.dev,https://b1steam-frames-2.nhb-120111.workers.dev,https://b1steam-frames-3.nhb-120111.workers.dev,https://b1steam-frames-4.nhb-120111.workers.dev,https://b1steam-frames-5.nhb-120111.workers.dev,https://b1steam-frames-6.nhb-120111.workers.dev"
  RATE_MITM_BURST = "100"
  RATE_MITM_REFILL_PER_MIN = "60"
  RATE_STATIC_BURST = "20"
  RATE_STATIC_REFILL_PER_MIN = "15"
  UPSTREAM_WORKERS = "32"
  CERT_CACHE_MAX = "256"
  CERT_CACHE_TTL_HOURS = "24"
  DOH_URL = "https://doh.b1s.id.vn/fly/dns-query"

# --- MITM TLS: 443 -> 8443 (RAW TCP, KHONG dung handler tls/http) ---
[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    port = 8443

# --- Static HTTP: 8080 -> 8080 (landing page + .mobileconfig) ---
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"
    port = 8080

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
