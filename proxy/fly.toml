app = "locket-proxy"
primary_region = "sin"

[build]
  dockerfile = "proxy/Dockerfile"

[[services]]
  internal_port = 8443
  protocol = "tcp"

  [[services.ports]]
    handlers = []
    port = 443

  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
