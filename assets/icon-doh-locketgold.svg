<!-- icon-doh-locketgold.svg — B1sTeam DoH (LocketGold) — shield ổ khóa, matcha v6 + gold -->
<!-- author: B1sTeam | b1s.id.vn | @b1steam -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B1sTeam DoH — LocketGold">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8553"/>
      <stop offset="0.52" stop-color="#1E5636"/>
      <stop offset="1" stop-color="#0E3320"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#E9E2CC"/>
    </linearGradient>
    <linearGradient id="shieldDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C5B38"/>
      <stop offset="1" stop-color="#123B25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE888"/>
      <stop offset="0.38" stop-color="#F2C94C"/>
      <stop offset="0.74" stop-color="#D9A03C"/>
      <stop offset="1" stop-color="#8A6A22"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#FFE888" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFE888" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.2" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Nền matcha full-bleed bo góc 22% -->
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#dots)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sheen)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#ambient)"/>
  <rect x="22" y="22" width="980" height="980" rx="206" fill="none" stroke="#FBF7EE" stroke-opacity="0.15" stroke-width="7"/>

  <!-- Khiên -->
  <path d="M512 132 L788 252 V506 C788 690 672 838 512 906 C352 838 236 690 236 506 V252 Z"
        fill="url(#shieldBody)" stroke="#0E3320" stroke-opacity="0.28" stroke-width="14" stroke-linejoin="round"/>
  <path d="M512 205 L706 302 V502 C706 655 608 781 512 838 C416 781 318 655 318 502 V302 Z"
        fill="url(#shieldDeep)"/>

  <!-- Ổ khóa gold -->
  <path d="M424 506 V412 a88 88 0 0 1 176 0 V506" fill="none" stroke="url(#gold)" stroke-width="56" stroke-linecap="round"/>
  <rect x="382" y="486" width="260" height="212" rx="40" fill="url(#gold)" stroke="#6F5312" stroke-opacity="0.35" stroke-width="8"/>
  <circle cx="512" cy="572" r="30" fill="#123B25"/>
  <rect x="501" y="578" width="22" height="58" rx="11" fill="#123B25"/>

  <!-- Tia sao -->
  <path d="M792 170l7.6 18.6 18.6 7.6-18.6 7.6-7.6 18.6-7.6-18.6-18.6-7.6 18.6-7.6z" fill="#FBF7EE" fill-opacity="0.9"/>
  <path d="M206 246l5.4 13.2 13.2 5.4-13.2 5.4-5.4 13.2-5.4-13.2-13.2-5.4 13.2-5.4z" fill="#FFE888" fill-opacity="0.95"/>
</svg>
