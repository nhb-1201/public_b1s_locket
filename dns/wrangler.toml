# B1sTeam - DoH Worker (multi-tenant) - Cloudflare Worker
# BAN DEPLOY CHINH THUC cua worker `b1steam-dns` (doh.b1s.id.vn) nam o repo
# `b1steam_web` (nhanh backend/workers/dns-resolver) - duoc CI deploy tu dong.
# File nay chi dung cho dev/staging (npx wrangler deploy -> *.workers.dev).
# KHONG dua custom domain vao day - se ghi de worker production.
# Repo nay la ban trien khai doc lap; ban chinh cua B1sTeam nam trong repo
# `b1steam_web` (nhanh `backend/workers/dns-resolver`).

name = "locket-gold-hub-dns"
main = "src/index.ts"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

observability = {
  logs = {
    enabled = true
    head_sampling_rate = 1
    invocation_logs = true
    persist = true
  }
}

# Cung D1 database voi backend (bang `dns_profiles` + `dns_usage_counters`).
# doi database_id theo database cua ban.
[[d1_databases]]
binding = "DB"
database_name = "b1steam"
database_id = "45bf85bd-c974-4a89-8f95-30a950821838"
