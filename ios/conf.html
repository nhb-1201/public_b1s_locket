<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07150d">
<meta name="robots" content="noindex">
<title>Cài .conf LocketGold (Free) ✦ B1sTeam</title>
<style>
body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#07150d; color:#f7f4ea; padding:24px }
.box{ max-width:420px; text-align:center; background:linear-gradient(168deg,#12321f 0%,#173d27 52%,#0d2417 100%); padding:28px 24px; border-radius:22px; border:2px solid rgba(255,209,102,.30); box-shadow:0 14px 40px rgba(0,0,0,.6) }
h1{ font-size:1.3rem; margin:0 0 10px; color:#ffe9a8 }
p{ font-size:.88rem; line-height:1.6; color:#cfe3d3; margin:0 0 14px }
a.btn{ display:inline-flex; align-items:center; gap:10px; padding:14px 22px; background:linear-gradient(135deg,#fff3a0,#ffd166 45%,#ffb703); color:#3d2b00; font-weight:900; text-decoration:none; border-radius:14px; border-bottom:4px solid #a3640a }
a.btn-ghost{ display:inline-block; margin-top:12px; font-size:.85em; color:#ffd166; text-decoration:none; font-weight:700 }
.ok{ color: #8fd6a4; font-weight:700 }
.err{ color:#ffb3b3 }
</style>
</head>
<body>
<main class="box" id="box">
  <h1>🚀 Cài .conf — 1-Click + License</h1>
  <p id="msg">Bấm nút dưới → Shadowrocket tự mở + hỏi thêm config.</p>
  <a class="btn" id="open" href="#">⚡ Cài .conf (Shadowrocket)</a>
  <p><a class="btn-ghost" href="https://b1s.id.vn/locketvip">Lấy key License (b1s.id.vn/locketvip)</a></p>
</main>
<script>
(function () {
  var msg = document.getElementById('msg');
  var open = document.getElementById('open');
  var params = new URLSearchParams(window.location.search);
  var key = (params.get('key') || '').trim().toUpperCase();
  var ok = /^B1S-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(key);
  var confUrl = ok
    ? 'https://locket.b1s.id.vn/api/v2/locketgold/config/alfretro?key=' + encodeURIComponent(key)
    : 'https://raw.githubusercontent.com/nhb-1201/public_b1s_locket/main/ios/alfretro-allinone.conf';
  var target = 'shadowrocket://config/add/' + confUrl;
  open.href = target;
  if (ok) { msg.innerHTML = 'Key hợp lệ. Bấm → Shadowrocket tự mở config <strong>alfretro-*.conf</strong>.'; }
  else { msg.innerHTML = 'Không truyền key → Config công khai (không có license). Lấy key trước tại <a href="https://b1s.id.vn/locketvip">b1s.id.vn/locketvip</a>.'; }
})();
</script>
</body>
</html>
