<html lang="vi">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#08080f;color:#f4f1e8;overflow:hidden;position:relative}
        .aurora{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% -10%,rgba(56,225,255,.13),transparent 60%),radial-gradient(ellipse 50% 40% at 15% 110%,rgba(184,134,11,.13),transparent 60%);pointer-events:none}
        .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black 25%,transparent 75%)}
        .card{position:relative;text-align:center;max-width:420px;width:100%;padding:40px 32px;border-radius:26px;border:1px solid rgba(56,225,255,.25);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 0 60px rgba(56,225,255,.08),0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
        .mark{width:76px;height:76px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(56,225,255,.22),rgba(56,225,255,.04) 70%);border:1px solid rgba(56,225,255,.4);box-shadow:0 0 34px rgba(56,225,255,.2);animation:float 4s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        .mark svg{width:40px;height:40px;stroke:#8ceaff}
        h1{font-family:"Space Grotesk";font-size:1.32rem;letter-spacing:-.01em;margin-bottom:10px}
        .grad{background:linear-gradient(135deg,#d9fbff,#38e1ff 50%,#0e7490);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        p{font-size:.86rem;color:#a6a3b4;line-height:1.65;margin-bottom:22px}
        .spinner{width:34px;height:34px;margin:0 auto 20px;border-radius:50%;border:3px solid rgba(56,225,255,.2);border-top-color:#38e1ff;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        a.cta{display:block;padding:15px 18px;border-radius:14px;background:linear-gradient(135deg,#d9fbff,#38e1ff 55%,#0e7490);color:#04222b;font-weight:800;text-decoration:none;font-size:.95rem;box-shadow:0 12px 34px rgba(56,225,255,.28);transition:transform .25s}
        a.cta:hover{transform:translateY(-2px)}
        .hint{margin-top:18px;font-size:.7rem;color:#6f6d80}
        .hint a{color:#ffd700;text-decoration:none}
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="grid"></div>
    <main class="card" role="status">
        <div class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Đang thêm <span class="grad">Config Locket Gold</span>…</h1>
        <p>Shadowrocket sẽ tự mở và nạp file <code>locketgold.conf</code>. Nếu không tự mở, bấm nút bên dưới.</p>
        <a class="cta" href="shadowrocket://config/add/https://raw.githubusercontent.com/nhb-1201/public_b1s_locket/main/ios/locketgold.conf">⚡ Mở trong Shadowrocket</a>
        <p class="hint">B1sTeam — Locket Gold VIP vĩnh viễn · <a href="https://b1s.id.vn/locketgold">b1s.id.vn/locketgold</a> · <a href="https://t.me/b1steam">@b1steam</a></p>
    </main>
</body>
</html>
