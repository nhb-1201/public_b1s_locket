<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12321f">
<meta name="robots" content="noindex">
<title>Cài Module LocketGold (Free) ✦ B1sTeam</title>
<style>
body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#fffbef; color:#3d2b00; padding:24px }
.box{ max-width:420px; text-align:center; background:#fff; padding:28px 24px; border-radius:18px; border:2px solid #a3640a; box-shadow:0 14px 40px rgba(0,0,0,.18) }
h1{ font-size:1.2rem; margin:0 0 10px; color:#12321f }
p{ font-size:.88rem; line-height:1.6; color:#5c3a00; margin:0 0 14px }
code{ background:#f3ead3; padding:2px 6px; border-radius:6px; font-size:.78rem }
a.btn{ display:inline-flex; align-items:center; gap:10px; padding:12px 18px; background:linear-gradient(135deg,#ffd166,#ffb703); color:#3d2b00; font-weight:800; text-decoration:none; border-radius:12px; border-bottom:3px solid #a3640a }
a.btn-ghost{ display:inline-block; margin-top:12px; font-size:.85em; color:#a3640a; text-decoration:none; font-weight:700 }
.ok{ color: #166534; font-weight:700 }
.err{ color:#b00020 }
</style>
</head>
<body>
<main class="box" id="box">
  <h1>🚀 Cài Module — 1-Click</h1>
  <p id="msg">Bấm nút bên dưới → Shadowrocket tự mở và hỏi “Add this module?”.</p>
  <a class="btn" id="open" href="#">⚡ Cài Module (Shadowrocket)</a>
  <p><a class="btn-ghost" href="https://b1s.id.vn/locketvip">Lấy key License (b1s.id.vn/locketvip)</a></p>
</main>
<script>
(function () {
  var msg = document.getElementById('msg');
  var open = document.getElementById('open');
  var params = new URLSearchParams(window.location.search);
  var key = (params.get('key') || '').trim().toUpperCase();
  // Ủy quyền: có thể truyền full key (B1S-XXXX-XXXX-XXXX) hoặc đuôi 4 ký tự + log vào từ /locketvip
  var ok = /^B1S-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(key);
  // Fallback: dùng module công khai từ raw GitHub nếu không có key
  var moduleUrl;
  if (ok) {
    moduleUrl = 'https://locket.b1s.id.vn/api/v2/locketgold/module/all-in-one?key=' + encodeURIComponent(key);
  } else {
    moduleUrl = 'https://raw.githubusercontent.com/nhb-1201/public_b1s_locket/main/ios/locketgold.sgmodule';
  }
  var target = 'shadowrocket://install?module=' + encodeURIComponent(moduleUrl);
  open.href = target;
  if (ok) { msg.innerHTML = 'Key hợp lệ. Bấm nút dưới → Shadowrocket tự mở + hỏi <strong>Add this module?</strong>'; }
  else { msg.innerHTML = 'Không truyền key → Module công khai tải <strong>không có license</strong> (Gold sẽ không mở). Lấy key trước từ <a href="https://b1s.id.vn/locketvip">b1s.id.vn/locketvip</a>.'; }
})();
</script>
</body>
</html>
