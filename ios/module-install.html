<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12321f" />
  <title>Đang mở trong Shadowrocket…</title>
  <meta name="robots" content="noindex" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fffbef; color: #3d2b00; padding: 24px; }
    .box { max-width: 420px; text-align: center; background: #fff; padding: 32px 28px; border-radius: 18px; border: 2px solid #a3640a; box-shadow: 0 14px 40px rgba(0,0,0,.18); }
    h1 { font-size: 1.2rem; margin-bottom: 8px; }
    p { font-size: .85rem; line-height: 1.6; color: #5c3a00; }
    code { background: #f3ead3; padding: 2px 6px; border-radius: 6px; font-size: .8rem; }
    a.btn { display: inline-block; margin-top: 16px; padding: 12px 22px; background: linear-gradient(135deg,#ffd166,#ffb703); color: #3d2b00; font-weight: 800; text-decoration: none; border-radius: 12px; }
    a.btn.ghost { background: transparent; border: 2px solid #a3640a; color: #a3640a; margin-top: 10px; font-size: .82rem; }
    .err { color: #b00020; }
  </style>
</head>
<body>
<main class="box" id="box">
  <h1>🚀 Đang mở Shadowrocket…</h1>
  <p id="msg">Vui lòng đợi trong khi Shadowrocket mở và hỏi “Add this module?”.</p>
  <a class="btn" id="open" href="#">Mở Shadowrocket</a>
  <p style="margin-top:14px;font-size:.72rem;color:#8a6a2a">Nếu app không tự mở: bấm nút trên. Vẫn không được? <br/>Chuyển qua <a href="https://b1s.id.vn/locketvip">b1s.id.vn/locketvip</a> → đăng nhập → <strong>Bước 2</strong> → <strong>Copy Module URL</strong> → Shadowrocket → nút <strong>“+”</strong> → <strong>Module</strong> → <strong>Paste</strong> → <strong>Add</strong>.</p>
</main>
<script>
(function () {
  var box = document.getElementById('box');
  var msg = document.getElementById('msg');
  var open = document.getElementById('open');
  var params = new URLSearchParams(window.location.search);
  var key = (params.get('key') || '').trim().toUpperCase();
  // Cho phép chỉ truyền đuôi key (4 ký tự cuối) — lắp phần còn lại nếu hợp lệ? KHÔNG — key đầy đủ luôn.
  var ok = /^B1S-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(key);
  if (!ok) {
    msg.innerHTML = '<span class="err">Thiếu hoặc sai <code>key</code>.</span><br/>Mở <a href="https://b1s.id.vn/locketvip">b1s.id.vn/locketvip</a> → đăng nhập → <strong>Bước 2</strong> để lấy link 1-Click riêng của bạn.';
    open.style.display = 'none';
    return;
  }
  var moduleUrl = 'https://locket.b1s.id.vn/api/v2/locketgold/module/all-in-one?key=' + encodeURIComponent(key);
  var target = 'shadowrocket://install?module=' + moduleUrl;
  open.href = target;
  // Tự nhảy ngay khi load (Safari cho phép custom scheme khi user chủ động vào trang).
  window.location.href = target;
})();
</script>
</body>
</html>
